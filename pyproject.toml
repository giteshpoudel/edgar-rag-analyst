[project]
name = "edgar-rag-analyst"
version = "0.1.0"
description = "RAG + function-calling assistant for SEC EDGAR filings, with evals"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "lancedb>=0.13",
    "lxml>=5.0",
    "openai>=1.40",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    "opentelemetry-sdk>=1.30",
    "pyarrow>=16",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "sentence-transformers>=3.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
edgar = "edgar_rag.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edgar_rag"]

[tool.ruff]
line-length = 100
target-version = "py311"
